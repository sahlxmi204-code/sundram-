<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Informational Draft</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#0f172a;
    color:white;
}
.container{
    max-width:430px;
    margin:20px auto;
    padding:18px;
}
.card{
    background:#1e293b;
    border-radius:18px;
    padding:18px;
    box-shadow:0 0 15px rgba(0,0,0,.3);
}
h1{
    text-align:center;
    color:#22c55e;
}
p{
    font-size:18px;
    margin:12px 0;
}
.btn{
    display:block;
    width:100%;
    padding:14px;
    margin-top:12px;
    border:none;
    border-radius:12px;
    background:#2563eb;
    color:white;
    text-decoration:none;
    text-align:center;
    font-size:17px;
}
.green{
    background:#16a34a;
}
.orange{
    background:#ea580c;
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>Informational Draft</h1>

<p><b>Name:</b> Rahul Das</p>

<p><b>Unique ID:</b> ID-000001</p>

<p><b>Age:</b> 20 Years</p>

<p><b>Normal Address:</b> Your Normal Address</p>

<a class="btn" target="_blank"
href="https://maps.google.com/?q=YOUR+LOCATION">
📍 Google Address
</a>

<a class="btn green"
href="tel:9876543211">
📞 Guardian Contact
</a>

<button class="btn orange" onclick="readInfo()">
🔊 Read Aloud
</button>

</div>

</div>

<script>

function readInfo(){

let msg =
"Informational Draft. " +
"Name Rahul Das. " +
"Unique I D, I D zero zero zero zero zero one. " +
"Age 20 years. " +
"Normal address, Your Normal Address. " +
"Guardian contact available. " +
"You can press the Guardian Contact button to call immediately. " +
"Google address is also available.";

speechSynthesis.speak(new SpeechSynthesisUtterance(msg));

}

</script>

</body>
</html>
