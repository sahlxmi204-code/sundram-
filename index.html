<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Informational Draft</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#0f172a;
color:white;
}

.container{
max-width:420px;
margin:20px auto;
padding:15px;
}

.card{
background:#1e293b;
border-radius:20px;
padding:20px;
box-shadow:0 8px 20px rgba(0,0,0,.4);
}

h1{
text-align:center;
color:#22c55e;
margin-bottom:20px;
}

.photo{
width:150px;
height:180px;
border:3px dashed white;
border-radius:12px;
margin:0 auto 20px;
display:flex;
align-items:center;
justify-content:center;
font-size:20px;
color:#cbd5e1;
}

.info{
font-size:18px;
margin:12px 0;
}

.btn{
display:block;
width:100%;
padding:15px;
margin-top:15px;
border:none;
border-radius:12px;
text-align:center;
text-decoration:none;
font-size:18px;
font-weight:bold;
color:white;
cursor:pointer;
}

.blue{background:#2563eb;}
.green{background:#16a34a;}
.orange{background:#ea580c;}
</style>

</head>

<body>

<div class="container">

<div class="card">

<h1>Informational Draft</h1>

<div class="photo">
Photo
</div>

<div class="info"><b>Name:</b> Rahul Das</div>

<div class="info"><b>Unique ID:</b> RD-000001</div>

<div class="info"><b>Age:</b> 20 Years</div>

<div class="info"><b>Sex:</b> Male</div>

<div class="info"><b>Normal Address:</b> Your Address Here</div>

<a class="btn blue"
href="https://goo.gl/maps/5AXP66QWyVMygDe28?g_st=ac"
target="_blank">
📍 Google Address
</a>

<a class="btn green"
href="tel:9876543210">
📞 Guardian Contact
</a>

<button class="btn orange" onclick="readInfo()">
🔊 Read Aloud
</button>

</div>

</div>

<script>
function readInfo(){

let msg =
"Informational Draft. " +
"Name Rahul Das. " +
"Unique ID R D zero zero zero zero zero one. " +
"Age twenty years. " +
"Sex Male. " +
"Normal address Your Address Here. " +
"Guardian contact is available. " +
"Google address is available.";

speechSynthesis.cancel();
speechSynthesis.speak(new SpeechSynthesisUtterance(msg));

}
</script>

</body>
</html>
